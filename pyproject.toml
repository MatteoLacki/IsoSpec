[build-system]
requires = ["setuptools", "scikit-build-core"]
build-backend = "scikit_build_core.build"

# Single source of truth for the version: the VERSION file at the top of the
# tree, which CMakeLists.txt reads too (see the note there). Keep that file to
# one bare version number on one line.
[[tool.dynamic-metadata]]
field = "version"
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = "^\\s*(?P<value>[0-9]+(?:\\.[0-9]+)*)"

[tool.scikit-build]
cmake.source-dir = "skbuild"
# The compiled part is not a Python extension module: it is a plain C-ABI
# shared library that isoFFI.py dlopen()s through cffi's ABI mode, and it never
# includes Python.h or links libpython. So the wheel is tagged py3-none-<plat>
# rather than per-interpreter (cp3XX) or Stable ABI (abi3): one binary per
# platform serves every CPython -- free-threaded builds included, which abi3
# does not cover -- and PyPy too. cibuildwheel builds it once per platform and
# only *tests* it under each remaining interpreter. Should the library ever
# start using the CPython API, this must go back to per-interpreter tags.
wheel.py-api = "py3"

[project]
name = "IsoSpecPy"
dependencies = ["cffi"]
description = "IsoSpecPy is a Python library for computing isotopic distributions of molecules."
dynamic = ["version"]
license = "BSD-2-Clause"
license-files = ["LICENCE"]
authors = [{name = "Michał Startek"}, {name = "Mateusz Łącki"}]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
]
keywords = ["isotopic distribution", "mass spectrometry", "chemistry", "isotopic envelope", "isotopologues"]

[project.urls]
Homepage = "https://github.com/MatteoLacki/IsoSpec"
Repository = "https://github.com/MatteoLacki/IsoSpec"



[project.optional-dependencies]
testing = ["pytest", "OldIsoSpecPy"]

[tool.pytest.ini_options]
testpaths = ["tests/Python"]

[tool.cibuildwheel]
enable = ["pypy"]
test-command = "python -m pytest -o faulthandler_timeout=600 {project}/tests/Python"
#test-sources = ["tests/Python"]
test-extras = ["testing"]

# Apple Clang's libc++ has no <experimental/simd>; build with Homebrew GCC instead.
[tool.cibuildwheel.macos]
before-all = "brew install gcc"
# NB: cibuildwheel evaluates these with bashlex, which supports command
# substitution but *not* pipelines - hence the `sh -c` wrapper.
environment = { CC = "$(sh -c 'ls $(brew --prefix gcc)/bin/gcc-* | sort -V | tail -1')", CXX = "$(sh -c 'ls $(brew --prefix gcc)/bin/g++-* | sort -V | tail -1')" }

[tool.scikit-build.sdist]
exclude = ["**/*"]
include = [
    "/src/IsoSpecPy/*.py",
    "/src/IsoSpec++/*.c",
    "/src/IsoSpec++/*.h",
    "/src/IsoSpec++/*.hpp",
    "/src/IsoSpec++/*.cpp",
    # skbuild/CMakeLists.txt include()s IsaDispatch.cmake; without this the
    # sdist configures no further than that line.
    "/src/IsoSpec++/*.cmake",
    "/VERSION",
    "/LICENCE",
    "/README.md",
    "/pyproject.toml",
    "/skbuild/CMakeLists.txt"
]
