name: Tests

# On a push, the checkout is tested. The Release workflow calls this one with
# from-package, after building the packages: pytest then runs on the built
# wheels (and on the sdist, installed from the tarball), and the C++ and C-ABI
# suites compile against the C++ sources shipped in the sdist rather than the
# checkout's, so a release is tested as it will be downloaded.
on:
    push:
        branches:
            - ci_test
            - main
            - winworkflow
    workflow_call:
        inputs:
            from-package:
                description: Test the built wheels and sdist instead of the checkout
                type: boolean
                default: false
            wheel-os:
                description: The runners wheels were built for (a JSON list); pytest runs on these
                type: string
                default: ''

jobs:
  run_pytest:
    name: Run pytest on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing cell must not cancel the other ~40 and hide whether the
      # failure is specific to one OS or Python.
      fail-fast: false
      matrix:
        # macos-15-intel is an Intel runner, macos-latest is Apple silicon
        os: ${{ fromJSON(inputs.wheel-os || '["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest", "macos-15-intel", "macos-latest", "windows-11-arm"]') }}
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        exclude:
        - os: windows-11-arm
          python-version: "3.10"
        - os: windows-11-arm
          python-version: "3.9"


    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          # Resolves to the newest release candidate while a version is still
          # pre-release; a no-op once it is final.
          allow-prereleases: true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
      - name: Install GCC (macOS only — Apple Clang/libc++ lacks <experimental/simd>)
        if: runner.os == 'macOS' && !inputs.from-package
        run: |
          brew install gcc
          GCC_PREFIX="$(brew --prefix gcc)"
          CC="$(ls "$GCC_PREFIX"/bin/gcc-* | sort -V | tail -1)"
          CXX="$(ls "$GCC_PREFIX"/bin/g++-* | sort -V | tail -1)"
          echo "CC=$CC" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"
      - name: Install package
        if: ${{ !inputs.from-package }}
        env:
          VERBOSE: '1'
        run: |
          python -m pip install -v .[testing]
      - uses: actions/download-artifact@v8
        if: ${{ inputs.from-package }}
        with:
          pattern: cibw-wheels-*
          path: dist
          merge-multiple: true
      - name: Install the built wheel
        # From dist/ alone (no index, no dependencies): the package under test
        # is the wheel the release built, never one already on PyPI. Then its
        # dependencies and the testing extras, from the index.
        if: ${{ inputs.from-package }}
        shell: bash
        run: |
          python -m pip install --no-index --no-deps --find-links dist --only-binary :all: "IsoSpecPy==$(cat VERSION)"
          python -m pip install "IsoSpecPy[testing]==$(cat VERSION)" --find-links dist
      - name: Test with pytest
        working-directory: ./tests/Python
        run: |
          python -m pytest .

  run_pytest_sdist:
    # The sdist as pip builds it on a user's machine: from the tarball, with the
    # platform's compiler (Homebrew GCC on macOS, as for the wheels).
    name: Run pytest on the sdist on ${{ matrix.os }}
    if: ${{ inputs.from-package }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install GCC (macOS only — Apple Clang/libc++ lacks <experimental/simd>)
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          GCC_PREFIX="$(brew --prefix gcc)"
          CC="$(ls "$GCC_PREFIX"/bin/gcc-* | sort -V | tail -1)"
          CXX="$(ls "$GCC_PREFIX"/bin/g++-* | sort -V | tail -1)"
          echo "CC=$CC" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: cibw-sdist
          path: dist
      - name: Install the sdist
        shell: bash
        env:
          VERBOSE: '1'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -v dist/*.tar.gz
          python -m pip install "IsoSpecPy[testing]==$(cat VERSION)" --find-links dist
      - name: Test with pytest
        working-directory: ./tests/Python
        run: |
          python -m pytest .

  run_cpp_tests:
    name: Run C++ tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86-64 (AVX2 via -march=native) and ARM64 (NEON) — covers the two SIMD
        # widths available on GitHub-hosted runners.  AVX-512 / the fake-AVX
        # Opteron are validated locally, never in CI.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: ${{ inputs.from-package }}
        with:
          name: cibw-sdist
          path: sdist
      - name: Use the C++ sources shipped in the sdist
        if: ${{ inputs.from-package }}
        shell: bash
        run: |
          tar xzf sdist/*.tar.gz -C sdist
          rm -rf src/IsoSpec++
          cp -r sdist/*/src/IsoSpec++ src/
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ clang make
      - name: Build and run the doctest suite (release, debug, ASan+UBSan, TSan)
        # `make test` also runs the compile-only fasta.h header-isolation check.
        # ThreadSanitizer's fixed shadow layout cannot cope with the 32 bits of
        # mmap randomisation the runners' kernels use ("unexpected memory
        # mapping"); 28 is the long-standing default it was built around.
        working-directory: ./tests/C++
        run: |
          sudo sysctl -w vm.mmap_rnd_bits=28
          make -j"$(nproc)" test
      - name: Build and run the C-ABI suite (cwrapper.h compiled as C11)
        working-directory: ./tests/C
        run: |
          make test

  run_cpp_tests_apple_clang:
    # Apple's own toolchain, as a Rust (cxx) build on macOS gets it: Apple clang
    # with libc++, no Homebrew GCC. libc++ has no usable <experimental/simd>,
    # so the kernels run their scalar fallback here; the point is that the
    # library builds and gives the same answers, not speed. On macOS g++ is
    # Apple clang too, so every configuration of `make test` uses it.
    name: Run C++ tests with Apple clang + libc++
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: ${{ inputs.from-package }}
        with:
          name: cibw-sdist
          path: sdist
      - name: Use the C++ sources shipped in the sdist
        if: ${{ inputs.from-package }}
        shell: bash
        run: |
          tar xzf sdist/*.tar.gz -C sdist
          rm -rf src/IsoSpec++
          cp -r sdist/*/src/IsoSpec++ src/
      - name: Show the toolchain
        run: |
          clang++ --version
          g++ --version
      - name: Build and run the doctest suite (release, debug, ASan+UBSan, TSan)
        working-directory: ./tests/C++
        run: |
          make -j"$(sysctl -n hw.ncpu)" test
      - name: Build and run the C-ABI suite (cwrapper.h compiled as C11)
        working-directory: ./tests/C
        run: |
          make test

  run_cpp_tests_msvc:
    # MSVC: the compiler a Rust (cxx) build on the windows-msvc target uses,
    # and the one the Python wheel is built with -- but nothing else runs the
    # C++ suite under it. MSVC has no <experimental/simd>, so the kernels run
    # scalar. The source list comes from the Makefile's TEST_SRCS, so a new
    # test file is picked up here without editing this job.
    name: Run C++ tests with MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: ${{ inputs.from-package }}
        with:
          name: cibw-sdist
          path: sdist
      - name: Use the C++ sources shipped in the sdist
        if: ${{ inputs.from-package }}
        shell: bash
        run: |
          tar xzf sdist/*.tar.gz -C sdist
          rm -rf src/IsoSpec++
          cp -r sdist/*/src/IsoSpec++ src/
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build and run the doctest suite
        shell: pwsh
        working-directory: ./tests/C++
        run: |
          $lines = Get-Content Makefile
          $first = ($lines | Select-String '^TEST_SRCS').LineNumber - 1
          $last = ($lines | Select-String '^# Rebuild').LineNumber - 1
          $srcs = $lines[$first..$last] | Select-String '[a-z_]+\.cpp' | ForEach-Object { $_.Matches[0].Value }
          $lib = '..\..\src\IsoSpec++'
          New-Item -ItemType Directory -Force build | Out-Null
          cl /nologo /std:c++20 /EHsc /O2 /W3 /MP /bigobj /utf-8 /Zc:__cplusplus /I $lib /DISOSPEC_ISA_DISPATCH=1 `
             $srcs "$lib\unity-build.cpp" "$lib\isa_kernels_baseline.cpp" "$lib\isa_kernels_avx.cpp" `
             "$lib\isa_kernels_v3.cpp" "$lib\isa_kernels_v4.cpp" /Fo:build\ /Fe:build\run_tests_msvc.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          build\run_tests_msvc.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and run the C-ABI suite (cwrapper.h compiled as C11)
        shell: pwsh
        working-directory: ./tests/C
        run: |
          $lib = '..\..\src\IsoSpec++'
          New-Item -ItemType Directory -Force build | Out-Null
          cl /nologo /std:c++20 /EHsc /O2 /W3 /bigobj /utf-8 /I $lib /c "$lib\unity-build.cpp" /Fo:build\unity.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /std:c11 /W3 /I $lib test_c_api.c build\unity.obj /Fo:build\ /Fe:build\test_c_api.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          build\test_c_api.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
