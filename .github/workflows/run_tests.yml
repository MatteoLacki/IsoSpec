name: Build

on:
    push:
        branches:
            - ci_test
            - main
            - winworkflow
        tags:
            - 'v*'

jobs:
  run_pytest:
    name: Run pytest on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-13 is an intel runner, macos-14 is apple silicon
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest, windows-11-arm]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
        - os: windows-11-arm
          python-version: "3.10"
        - os: windows-11-arm
          python-version: "3.9"


    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
      - name: Install GCC (macOS only — Apple Clang/libc++ lacks <experimental/simd>)
        if: runner.os == 'macOS'
        run: |
          brew install gcc
          GCC_PREFIX="$(brew --prefix gcc)"
          CC="$(ls "$GCC_PREFIX"/bin/gcc-* | sort -V | tail -1)"
          CXX="$(ls "$GCC_PREFIX"/bin/g++-* | sort -V | tail -1)"
          echo "CC=$CC" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"
      - name: Install package
        env:
          VERBOSE: '1'
        run: |
          python -m pip install -v .[testing]
      - name: Test with pytest
        working-directory: ./tests/Python
        run: |
          python -m pytest .

  run_cpp_tests:
    name: Run C++ tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86-64 (AVX2 via -march=native) and ARM64 (NEON) — covers the two SIMD
        # widths available on GitHub-hosted runners.  AVX-512 / the fake-AVX
        # Opteron are validated locally, never in CI.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ clang make
      - name: Build and run the doctest suite (release, debug, ASan+UBSan)
        # `make test` also runs the compile-only fasta.h header-isolation check.
        working-directory: ./tests/C++
        run: |
          make -j"$(nproc)" test

