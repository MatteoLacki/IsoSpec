name: R

# The R package, as CRAN receives it: the tarball R CMD build makes (it turns
# the symlinks in src/IsoSpecR/src into copies of src/IsoSpec++), checked with
# R CMD check and R CMD check --as-cran on Linux, macOS and Windows; either
# fails on any WARNING or ERROR, not only on the ERRORs R CMD check itself
# fails on. On a push the tarball is built here; the Release workflow calls
# this one with from-package to check the tarball it built instead.
on:
    push:
        branches:
            - main
    pull_request:
    workflow_call:
        inputs:
            from-package:
                description: Check the release-r artifact instead of building one
                type: boolean
                default: false

jobs:
  build:
    name: R CMD build
    if: ${{ !inputs.from-package }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - run: R CMD build src/IsoSpecR
      - uses: actions/upload-artifact@v7
        with:
          name: release-r
          path: IsoSpecR_*.tar.gz

  check:
    name: R CMD check (${{ matrix.os }})
    needs: build
    # Also when build was skipped (from-package): the tarball then comes from
    # the calling Release workflow.
    if: ${{ !cancelled() && needs.build.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # The comparison with the version already on CRAN only for a release:
      # on ordinary pushes after a release, the version is CRAN's until the
      # next bump, which is not an error.
      _R_CHECK_CRAN_INCOMING_REMOTE_: ${{ inputs.from-package && 'true' || 'false' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # The repository named explicitly: on Windows this shell is Rtools' bash,
      # and an R started from it does not see the CRAN mirror setup-r
      # configures ("trying to use CRAN without setting a mirror").
      - name: Install dependencies
        run: Rscript -e 'install.packages(c("Rcpp", "testthat"), repos = Sys.getenv("RSPM", "https://cloud.r-project.org"))'
      - uses: actions/download-artifact@v8
        with:
          name: release-r
      # A slow check puts its timing between the dots and the verdict
      # ("... [4s/10s] WARNING"), hence the match on the line's end.
      - name: R CMD check
        run: |
          R CMD check --no-manual IsoSpecR_*.tar.gz
          if grep -E '^\* checking .*(WARNING|ERROR)$' IsoSpecR.Rcheck/00check.log; then exit 1; fi
      - name: R CMD check --as-cran
        run: |
          R CMD check --as-cran --no-manual IsoSpecR_*.tar.gz
          if grep -E '^\* checking .*(WARNING|ERROR)$' IsoSpecR.Rcheck/00check.log; then exit 1; fi
      - name: Check log
        if: always()
        run: cat IsoSpecR.Rcheck/00check.log || true
