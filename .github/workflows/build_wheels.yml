name: Release
run-name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name) || format('Release rehearsal ({0})', github.ref_name) }}

# Pushing a v* tag builds, checks *and publishes* (a draft GitHub release, then
# PyPI, then the release made public). Anything else is a full rehearsal:
# every build and check of a real release -- wheels on every platform, sdist,
# release notes from CHANGELOG, the Rust .crate, R CMD check --as-cran -- with
# the publishing jobs skipped. Run one with the Run workflow button,
# `gh workflow run build_wheels.yml --ref <branch>`, or by pushing to
# ci_wheels (`git push -f origin HEAD:ci_wheels`); by hand, the wheel build
# can be narrowed to one runner and one Python:
#     gh workflow run build_wheels.yml --ref main -f os=macos-latest -f build='cp39-*'
# Never re-push a version tag to test: a filename that reaches PyPI once can
# never be replaced.
#
# The file keeps its old name, build_wheels.yml: PyPI's trusted publisher for
# IsoSpecPy names this workflow file, and a renamed file could not upload.
on:
  push:
    branches:
#      - version_2_2
      - ci_wheels
    tags:
      - v*
  workflow_dispatch:
    inputs:
      os:
        description: Runner to build on
        type: choice
        default: all
        options:
          - all
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-15-intel
          - macos-latest
      build:
        # The wheel is py3-none-<platform> (see wheel.py-api in pyproject.toml):
        # it is compiled once per platform, under the first selected Python,
        # and merely tested under the rest -- so narrowing this narrows what
        # gets *tested*, not what gets built.
        description: 'CIBW_BUILD selector, e.g. "cp39-*" (blank = every Python)'
        type: string
        default: ''

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Guards against a wedged test step burning the full 6h GitHub job cap on
    # every runner (macOS billed at 10x) -- see investigation.txt, 2026-08.
    timeout-minutes: 90
    strategy:
      # A release is all-or-nothing, so on a v* tag let the first failure cancel
      # the rest. Everywhere else the point of the run is the report, and one
      # platform's failure must not hide the other five (it did, 2026-08).
      fail-fast: ${{ startsWith(github.ref, 'refs/tags/v') }}
      matrix:
        #os: [ubuntu-20.04, windows-2019, macos-10.15]
        # One runner when asked for by hand, the full set otherwise: `inputs` is
        # empty on push, so the fallback covers tags and ci_wheels alike.
        os: ${{ fromJSON(inputs.os && inputs.os != 'all'
                         && format('["{0}"]', inputs.os)
                         || '["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest", "windows-11-arm", "macos-15-intel", "macos-latest"]') }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Used to host cibuildwheel
      - uses: actions/setup-python@v7

      # The tag must name VERSION. Tags only: a rehearsal runs before the
      # tag exists, when the latest tag is still the previous release's.
      - name: Check version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python .github/scripts/check_version.py

      # 4.2.0 is the first release that builds and tests cp315/cp315t without
      # enable = ["cpython-prerelease"].
      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=4.2"

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        # to supply options, put them in 'env', like:
        env:
          GITHUB_BUILDING_WHEELS: 1
          # "*" is cibuildwheel's own default; spelling it out keeps an unset
          # input from becoming an empty selector that matches nothing.
          CIBW_BUILD: ${{ inputs.build || '*' }}

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The tag must name VERSION. Tags only: a rehearsal runs before the
      # tag exists, when the latest tag is still the previous release's.
      - name: Check version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python .github/scripts/check_version.py

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

      # The release text is VERSION's section of CHANGELOG (the lines between
      # its "2.6.0" heading and the next version's). Extracted here, before
      # anything is published, so that a release without a changelog entry
      # fails while there is still nothing to undo.
      - name: Release notes from CHANGELOG
        run: |
          version=$(cat VERSION)
          awk -v ver="$version" '$0 == ver {found = 1; getline; next}
                                 found && /^[0-9]+\.[0-9]+(\.[0-9]+)?( |$)/ {exit}
                                 found' CHANGELOG \
            | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG has no section for $version"
            exit 1
          fi
          cat release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  package_crate:
    # The Rust sources as crates.io would receive them. Publishing the crate
    # stays manual (cargo publish); the release only carries the .crate.
    name: Package Rust crate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # Builds the crate from the packaged tarball alone, so a .crate missing a
      # C++ source fails here.
      - run: cargo package
      - uses: actions/upload-artifact@v7
        with:
          name: release-crate
          path: target/package/*.crate

  build_r:
    # The CRAN source tarball, checked the way CRAN checks it. R CMD build
    # copies the symlinks in src/IsoSpecR/src as the files they point to, so
    # the tarball is self-contained.
    name: Build and check R package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install dependencies
        run: Rscript -e 'install.packages(c("Rcpp", "testthat"))'
      - name: R CMD build
        run: R CMD build src/IsoSpecR
      # R CMD check exits non-zero only on ERROR; CRAN rejects WARNINGs too,
      # so both checks fail on either. A slow check puts its timing between
      # the dots and the verdict ("... [4s/10s] WARNING"), hence the match on
      # the line's end. The incoming-feasibility WARNING includes a version
      # CRAN already has: DESCRIPTION's Version must be bumped for a release.
      # NOTEs are left to a human (a stale Date field, say, is one).
      - name: R CMD check
        run: |
          R CMD check --no-manual IsoSpecR_*.tar.gz
          if grep -E '^\* checking .*(WARNING|ERROR)$' IsoSpecR.Rcheck/00check.log; then exit 1; fi
      - name: R CMD check --as-cran
        run: |
          R CMD check --as-cran --no-manual IsoSpecR_*.tar.gz
          if grep -E '^\* checking .*(WARNING|ERROR)$' IsoSpecR.Rcheck/00check.log; then exit 1; fi
      - name: Check logs
        if: always()
        run: cat IsoSpecR.Rcheck/00check.log || true
      - uses: actions/upload-artifact@v7
        with:
          name: release-r
          path: IsoSpecR_*.tar.gz

  # Publishing, reversible steps first: a draft GitHub release (invisible,
  # deletable) carrying every source package, checked; then PyPI, which
  # cannot be undone (a filename that reaches it once can never be uploaded
  # again); then the draft made public. A failure before PyPI leaves only a
  # draft behind, which a rerun of the tag replaces.

  draft_release:
    # The GitHub release for the tag, as a draft: the source packages for all
    # three registries (the Python sdist, the Rust .crate, the CRAN tarball),
    # each built and checked above, and the version's CHANGELOG section as
    # its text. CRAN and crates.io are then fed by hand from these files.
    needs: [build_wheels, build_sdist, package_crate, build_r]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cibw-sdist
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: release-crate
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: release-r
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Create the draft release
        run: |
          ls -l release
          # A draft left by an earlier, failed run of this tag is replaced; a
          # published release is never touched.
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::release $GITHUB_REF_NAME is already published"
              exit 1
            fi
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag \
            --title "IsoSpec ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
      - name: Check the draft
        run: |
          expected=$(ls release | wc -l)
          gh release view "$GITHUB_REF_NAME" --json isDraft,assets \
            --jq '"draft: \(.isDraft)", (.assets[] | "\(.name) \(.size) \(.state)")'
          uploaded=$(gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '[.assets[] | select(.state == "uploaded" and .size > 0)] | length')
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)
          if [ "$draft" != true ] || [ "$uploaded" != "$expected" ]; then
            echo "::error::draft release incomplete: $uploaded of $expected assets uploaded, draft=$draft"
            exit 1
          fi

  upload_pypi:
    needs: [draft_release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        # To test uploads to TestPyPI, uncomment the following:
        # with:
        #   repository-url: https://test.pypi.org/legacy/

  publish_release:
    # PyPI has the wheels: the draft becomes the public release.
    needs: [upload_pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Publish the draft release
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = false
