name: Wheels

# Pushing a v* tag builds *and publishes*. To exercise the wheel build without
# that, push the branch instead -- `git push -f origin HEAD:ci_wheels` -- or use
# the Run workflow button / `gh workflow run build_wheels.yml --ref <branch>`,
# which can narrow the run to one runner and one Python:
#     gh workflow run build_wheels.yml --ref main -f os=macos-latest -f build='cp39-*'
# Never re-push a version tag to test: upload_pypi fires on every v* push, and a
# filename that reaches PyPI once can never be replaced.
on:
  push:
    branches:
#      - version_2_2
      - ci_wheels
    tags:
      - v*
  workflow_dispatch:
    inputs:
      os:
        description: Runner to build on
        type: choice
        default: all
        options:
          - all
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-15-intel
          - macos-latest
      build:
        # The wheel is py3-none-<platform> (see wheel.py-api in pyproject.toml):
        # it is compiled once per platform, under the first selected Python,
        # and merely tested under the rest -- so narrowing this narrows what
        # gets *tested*, not what gets built.
        description: 'CIBW_BUILD selector, e.g. "cp39-*" (blank = every Python)'
        type: string
        default: ''

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Guards against a wedged test step burning the full 6h GitHub job cap on
    # every runner (macOS billed at 10x) -- see investigation.txt, 2026-08.
    timeout-minutes: 90
    strategy:
      # A release is all-or-nothing, so on a v* tag let the first failure cancel
      # the rest. Everywhere else the point of the run is the report, and one
      # platform's failure must not hide the other five (it did, 2026-08).
      fail-fast: ${{ startsWith(github.ref, 'refs/tags/v') }}
      matrix:
        #os: [ubuntu-20.04, windows-2019, macos-10.15]
        # One runner when asked for by hand, the full set otherwise: `inputs` is
        # empty on push, so the fallback covers tags and ci_wheels alike.
        os: ${{ fromJSON(inputs.os && inputs.os != 'all'
                         && format('["{0}"]', inputs.os)
                         || '["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest", "windows-11-arm", "macos-15-intel", "macos-latest"]') }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Used to host cibuildwheel
      - uses: actions/setup-python@v7

      - name: Check version
        run: python .github/scripts/check_version.py

      # 4.2.0 is the first release that builds and tests cp315/cp315t without
      # enable = ["cpython-prerelease"].
      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=4.2"

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        # to supply options, put them in 'env', like:
        env:
          GITHUB_BUILDING_WHEELS: 1
          # "*" is cibuildwheel's own default; spelling it out keeps an unset
          # input from becoming an empty selector that matches nothing.
          CIBW_BUILD: ${{ inputs.build || '*' }}

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check version
        run: python .github/scripts/check_version.py

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

      # The release text is VERSION's section of CHANGELOG (the lines between
      # its "2.6.0" heading and the next version's). Extracted here, before
      # anything is published, so that a release without a changelog entry
      # fails while there is still nothing to undo.
      - name: Release notes from CHANGELOG
        run: |
          version=$(cat VERSION)
          awk -v ver="$version" '$0 == ver {found = 1; getline; next}
                                 found && /^[0-9]+\.[0-9]+(\.[0-9]+)?( |$)/ {exit}
                                 found' CHANGELOG \
            | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG has no section for $version"
            exit 1
          fi
          cat release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  package_crate:
    # The Rust sources as crates.io would receive them. Publishing the crate
    # stays manual (cargo publish); the release only carries the .crate.
    name: Package Rust crate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # Builds the crate from the packaged tarball alone, so a .crate missing a
      # C++ source fails here.
      - run: cargo package
      - uses: actions/upload-artifact@v7
        with:
          name: release-crate
          path: target/package/*.crate

  build_r:
    # The CRAN source tarball, checked the way CRAN checks it. R CMD build
    # copies the symlinks in src/IsoSpecR/src as the files they point to, so
    # the tarball is self-contained.
    name: Build and check R package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install dependencies
        run: Rscript -e 'install.packages(c("Rcpp", "testthat"))'
      - name: R CMD build
        run: R CMD build src/IsoSpecR
      # R CMD check exits non-zero only on ERROR; CRAN rejects WARNINGs too,
      # so both checks fail on either. A slow check puts its timing between
      # the dots and the verdict ("... [4s/10s] WARNING"), hence the match on
      # the line's end. The incoming-feasibility WARNING includes a version
      # CRAN already has: DESCRIPTION's Version must be bumped for a release.
      # NOTEs are left to a human (a stale Date field, say, is one).
      - name: R CMD check
        run: |
          R CMD check --no-manual IsoSpecR_*.tar.gz
          if grep -E '^\* checking .*(WARNING|ERROR)$' IsoSpecR.Rcheck/00check.log; then exit 1; fi
      - name: R CMD check --as-cran
        run: |
          R CMD check --as-cran --no-manual IsoSpecR_*.tar.gz
          if grep -E '^\* checking .*(WARNING|ERROR)$' IsoSpecR.Rcheck/00check.log; then exit 1; fi
      - name: Check logs
        if: always()
        run: cat IsoSpecR.Rcheck/00check.log || true
      - uses: actions/upload-artifact@v7
        with:
          name: release-r
          path: IsoSpecR_*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist, package_crate, build_r]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    # if: github.event_name == 'release' && github.event.action == 'published'
    # or, alternatively, upload to PyPI on every tag starting with 'v' (remove on: release above to use this)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        # To test uploads to TestPyPI, uncomment the following:
        # with:
        #   repository-url: https://test.pypi.org/legacy/

  github_release:
    # After PyPI accepted the wheels: the GitHub release for the same tag, with
    # the source packages for all three registries (the Python sdist, the Rust
    # .crate, the CRAN tarball), each built and checked above, and the
    # version's CHANGELOG section as its text.
    needs: [upload_pypi, build_sdist, package_crate, build_r]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cibw-sdist
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: release-crate
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: release-r
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l release
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "IsoSpec ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
