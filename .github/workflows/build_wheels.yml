name: Wheels

# Pushing a v* tag builds *and publishes*. To exercise the wheel build without
# that, push the branch instead -- `git push -f origin HEAD:ci_wheels` -- or use
# the Run workflow button / `gh workflow run build_wheels.yml --ref <branch>`,
# which can narrow the run to one runner and one Python:
#     gh workflow run build_wheels.yml --ref main -f os=macos-latest -f build='cp39-*'
# Never re-push a version tag to test: upload_pypi fires on every v* push, and a
# filename that reaches PyPI once can never be replaced.
on:
  push:
    branches:
#      - version_2_2
      - ci_wheels
    tags:
      - v*
  workflow_dispatch:
    inputs:
      os:
        description: Runner to build on
        type: choice
        default: all
        options:
          - all
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-15-intel
          - macos-latest
      build:
        # The wheel is py3-none-<platform> (see wheel.py-api in pyproject.toml):
        # it is compiled once per platform, under the first selected Python,
        # and merely tested under the rest -- so narrowing this narrows what
        # gets *tested*, not what gets built.
        description: 'CIBW_BUILD selector, e.g. "cp39-*" (blank = every Python)'
        type: string
        default: ''

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Guards against a wedged test step burning the full 6h GitHub job cap on
    # every runner (macOS billed at 10x) -- see investigation.txt, 2026-08.
    timeout-minutes: 90
    strategy:
      # A release is all-or-nothing, so on a v* tag let the first failure cancel
      # the rest. Everywhere else the point of the run is the report, and one
      # platform's failure must not hide the other five (it did, 2026-08).
      fail-fast: ${{ startsWith(github.ref, 'refs/tags/v') }}
      matrix:
        #os: [ubuntu-20.04, windows-2019, macos-10.15]
        # One runner when asked for by hand, the full set otherwise: `inputs` is
        # empty on push, so the fallback covers tags and ci_wheels alike.
        os: ${{ fromJSON(inputs.os && inputs.os != 'all'
                         && format('["{0}"]', inputs.os)
                         || '["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest", "windows-11-arm", "macos-15-intel", "macos-latest"]') }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Used to host cibuildwheel
      - uses: actions/setup-python@v7

      - name: Check version
        run: python .github/scripts/check_version.py

      # 4.2.0 is the first release that builds and tests cp315/cp315t without
      # enable = ["cpython-prerelease"].
      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=4.2"

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        # to supply options, put them in 'env', like:
        env:
          GITHUB_BUILDING_WHEELS: 1
          # "*" is cibuildwheel's own default; spelling it out keeps an unset
          # input from becoming an empty selector that matches nothing.
          CIBW_BUILD: ${{ inputs.build || '*' }}

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check version
        run: python .github/scripts/check_version.py

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    # if: github.event_name == 'release' && github.event.action == 'published'
    # or, alternatively, upload to PyPI on every tag starting with 'v' (remove on: release above to use this)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        # To test uploads to TestPyPI, uncomment the following:
        # with:
        #   repository-url: https://test.pypi.org/legacy/
